<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Asistente Web - Intelindev</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; display: flex; justify-content: center; align-items: center; height: 100vh; background: #0f172a; margin: 0; }
        .widget-container { text-align: center; background: #1e293b; padding: 40px; border-radius: 20px; box-shadow: 0 10px 25px rgba(0,0,0,0.5); }
        h2 { color: #f8fafc; margin-bottom: 5px; }
        p { color: #94a3b8; margin-bottom: 30px; }
        button { padding: 15px 35px; font-size: 18px; font-weight: bold; color: white; background: #3b82f6; border: none; border-radius: 50px; cursor: pointer; transition: all 0.3s ease; box-shadow: 0 4px 15px rgba(59, 130, 246, 0.4); }
        button:hover { background: #2563eb; transform: translateY(-2px); }
        button.active { background: #ef4444; box-shadow: 0 4px 15px rgba(239, 68, 68, 0.4); }
    </style>
</head>
<body>
    <div class="widget-container">
        <h2>Atención al Cliente</h2>
        <p>Habla con nuestro agente de Intelindev ahora mismo.</p>
        <button id="callButton">📞 Iniciar Llamada</button>
    </div>

    <!-- Importamos el SDK de Retell directo desde el navegador -->
    <script type="module">
        import { RetellWebClient } from 'https://esm.sh/retell-client-js-sdk';

        const retellClient = new RetellWebClient();
        const button = document.getElementById('callButton');
        let isCalling = false;

        button.addEventListener('click', async () => {
            if (isCalling) {
                retellClient.stopCall();
                return; // El evento 'call_ended' se encargará de los botones
            }

            button.innerText = '⏳ Conectando...';

            try {
                // 1. Pedimos el token a tu servidor local
                const response = await fetch('http://localhost:8080/create-web-call', { method: 'POST' });
                const data = await response.json();

                // 2. Iniciamos la llamada conectando el micrófono a Retell
                await retellClient.startCall({
                    accessToken: data.access_token,
                });

                button.innerText = '🛑 Colgar Llamada';
                button.classList.add('active');
                isCalling = true;

            } catch (error) {
                console.error("Error al conectar:", error);
                button.innerText = '❌ Error al conectar';
                setTimeout(() => { button.innerText = '📞 Iniciar Llamada'; }, 3000);
            }
        });

        // Cuando la llamada termine (ya sea por el usuario o por el bot)
        retellClient.on('call_ended', () => {
            button.innerText = '📞 Iniciar Llamada';
            button.classList.remove('active');
            isCalling = false;
        });
    </script>
</body>
</html>
