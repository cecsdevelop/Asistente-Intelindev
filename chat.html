<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Chat - Intelindev</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex; justify-content: center; align-items: center;
            height: 100vh; background: #0f172a; margin: 0;
        }
        .chat-container {
            width: 380px; max-width: 92vw; height: 620px; max-height: 88vh;
            background: #1e293b; border-radius: 20px; box-shadow: 0 10px 25px rgba(0,0,0,0.5);
            display: flex; flex-direction: column; overflow: hidden;
        }
        .chat-header {
            padding: 18px 20px; background: #1e293b; border-bottom: 1px solid #334155;
            display: flex; align-items: center; gap: 10px;
        }
        .chat-header .dot { width: 10px; height: 10px; border-radius: 50%; background: #22c55e; flex-shrink: 0; transition: background 0.2s ease; }
        .chat-header .dot.en-llamada { background: #ef4444; animation: pulso 1.5s infinite; }
        @keyframes pulso { 0%, 100% { opacity: 1; } 50% { opacity: 0.4; } }
        .chat-header h2 { margin: 0; color: #f8fafc; font-size: 16px; }
        .chat-header p { margin: 0; color: #94a3b8; font-size: 12px; }

        .chat-messages {
            flex: 1; overflow-y: auto; padding: 16px; display: flex; flex-direction: column; gap: 10px;
        }
        .msg { max-width: 82%; padding: 10px 14px; border-radius: 14px; font-size: 14px; line-height: 1.4; white-space: pre-wrap; }
        .msg.assistant { align-self: flex-start; background: #334155; color: #e2e8f0; border-bottom-left-radius: 4px; }
        .msg.user { align-self: flex-end; background: #3b82f6; color: white; border-bottom-right-radius: 4px; }
        .msg.system { align-self: center; background: transparent; color: #64748b; font-size: 12px; font-style: italic; text-align: center; }
        .msg.subtitulo { border: 1px dashed #475569; }

        .typing { align-self: flex-start; color: #64748b; font-size: 13px; padding: 0 4px; }

        .chat-input {
            display: flex; gap: 8px; padding: 14px; border-top: 1px solid #334155; background: #1e293b;
        }
        .chat-input input {
            flex: 1; padding: 12px 14px; border-radius: 24px; border: none;
            background: #0f172a; color: #f8fafc; font-size: 14px; outline: none;
        }
        .chat-input input::placeholder { color: #64748b; }
        .chat-input button {
            width: 44px; height: 44px; border-radius: 50%; border: none; cursor: pointer;
            color: white; font-size: 18px; display: flex; align-items: center; justify-content: center;
            transition: background 0.2s ease; flex-shrink: 0;
        }
        #sendButton { background: #3b82f6; }
        #sendButton:hover { background: #2563eb; }
        #callButton { background: #22c55e; }
        #callButton:hover { background: #16a34a; }
        #callButton.en-llamada { background: #ef4444; }
        #callButton.en-llamada:hover { background: #dc2626; }
        button:disabled { background: #475569 !important; cursor: not-allowed; }
        .chat-input input:disabled { opacity: 0.6; }
    </style>
</head>
<body>
    <div class="chat-container">
        <div class="chat-header">
            <div class="dot" id="statusDot"></div>
            <div>
                <h2>Alex - Asistente Intelindev</h2>
                <p id="statusText">Habla o escribe, como prefieras</p>
            </div>
        </div>
        <div class="chat-messages" id="chatMessages"></div>
        <div class="chat-input">
            <button id="callButton" aria-label="Llamar">📞</button>
            <input type="text" id="chatInput" placeholder="Escribe tu mensaje..." autocomplete="off" />
            <button id="sendButton" aria-label="Enviar">➤</button>
        </div>
    </div>

    <script type="module">
        import { RetellWebClient } from 'https://esm.sh/retell-client-js-sdk';

        // Cambia esta URL cuando el backend esté desplegado (mismo servidor que /chat y /create-web-call).
        const SERVER_URL = 'http://localhost:8080';

        const messagesEl = document.getElementById('chatMessages');
        const inputEl = document.getElementById('chatInput');
        const sendButton = document.getElementById('sendButton');
        const callButton = document.getElementById('callButton');
        const statusDot = document.getElementById('statusDot');
        const statusText = document.getElementById('statusText');

        const retellClient = new RetellWebClient();

        // hilo = fuente de verdad de TODO lo que se muestra (texto, voz ya finalizada
        // y avisos de sistema). Mientras hay una llamada activa, los subtítulos en vivo
        // se muestran aparte (turnosVoz) y solo se fusionan a hilo cuando la llamada
        // termina, porque el transcript que manda Retell puede reescribirse mientras
        // el STT se afina. renderTodo() redibuja siempre desde estos dos arrays, así
        // que cualquier mensaje (incluidos los de sistema) debe vivir en uno de los dos.
        let hilo = [];
        let turnosVoz = [];
        let enLlamada = false;
        let enviando = false;
        let conversacionCerrada = false;
        let resolverCierrePendiente = null;

        // Si el usuario empieza a escribir mientras hay una llamada activa, cortamos
        // la llamada automáticamente para no obligarlo a colgar manualmente.
        function esperarCierreLlamada() {
            if (!enLlamada) return Promise.resolve();
            return new Promise(resolve => { resolverCierrePendiente = resolve; });
        }

        function crearBurbuja(role, texto, extraClass) {
            const div = document.createElement('div');
            div.className = `msg ${role}${extraClass ? ' ' + extraClass : ''}`;
            div.textContent = texto;
            return div;
        }

        function agregarMensaje(role, texto) {
            hilo.push({ role, content: texto });
            renderTodo();
        }

        function renderTodo() {
            messagesEl.innerHTML = '';
            hilo.forEach(m => messagesEl.appendChild(crearBurbuja(m.role, m.content)));
            turnosVoz.forEach(m => messagesEl.appendChild(crearBurbuja(m.role, m.content, 'subtitulo')));
            messagesEl.scrollTop = messagesEl.scrollHeight;
        }

        function mostrarEscribiendo(mostrar) {
            let el = document.getElementById('typingIndicator');
            if (mostrar) {
                if (el) return;
                el = document.createElement('div');
                el.id = 'typingIndicator';
                el.className = 'typing';
                el.textContent = 'Alex está escribiendo...';
                messagesEl.appendChild(el);
                messagesEl.scrollTop = messagesEl.scrollHeight;
            } else if (el) {
                el.remove();
            }
        }

        function marcarConversacionCerrada() {
            conversacionCerrada = true;
            inputEl.disabled = true;
            sendButton.disabled = true;
            callButton.disabled = true;
            agregarMensaje('system', 'La conversación ha finalizado.');
        }

        // --- TEXTO ---

        async function enviarMensaje() {
            const texto = inputEl.value.trim();
            if (!texto || enviando || conversacionCerrada) return;

            if (enLlamada) {
                retellClient.stopCall();
                await esperarCierreLlamada();
            }

            agregarMensaje('user', texto);
            inputEl.value = '';

            enviando = true;
            sendButton.disabled = true;
            mostrarEscribiendo(true);

            try {
                // El backend solo espera turnos de usuario/asistente, sin los avisos de sistema.
                const mensajesParaApi = hilo.filter(m => m.role === 'user' || m.role === 'assistant');
                const response = await fetch(`${SERVER_URL}/chat`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ messages: mensajesParaApi })
                });
                const data = await response.json();

                mostrarEscribiendo(false);

                if (!response.ok) {
                    agregarMensaje('system', 'Hubo un problema de conexión. Intenta de nuevo.');
                    return;
                }

                agregarMensaje('assistant', data.respuesta);

                if (data.cerrar) marcarConversacionCerrada();
            } catch (error) {
                console.error('Error en el chat:', error);
                mostrarEscribiendo(false);
                agregarMensaje('system', 'No se pudo conectar con el servidor.');
            } finally {
                enviando = false;
                if (!conversacionCerrada) sendButton.disabled = false;
                inputEl.focus();
            }
        }

        sendButton.addEventListener('click', enviarMensaje);
        inputEl.addEventListener('keydown', (e) => {
            if (e.key === 'Enter') enviarMensaje();
        });
        inputEl.addEventListener('input', () => {
            if (enLlamada && inputEl.value.length > 0) {
                retellClient.stopCall();
            }
        });

        // --- VOZ ---

        callButton.addEventListener('click', async () => {
            if (conversacionCerrada) return;
            if (enLlamada) {
                retellClient.stopCall();
                return;
            }

            callButton.innerText = '⏳';
            callButton.disabled = true;

            try {
                const response = await fetch(`${SERVER_URL}/create-web-call`, { method: 'POST' });
                const data = await response.json();
                await retellClient.startCall({ accessToken: data.access_token });

                enLlamada = true;
                turnosVoz = [];
                callButton.innerText = '🛑';
                callButton.classList.add('en-llamada');
                callButton.disabled = false;
                statusDot.classList.add('en-llamada');
                statusText.textContent = 'En llamada — subtítulos en vivo';
                agregarMensaje('system', 'Llamada iniciada. Si no escuchas bien o prefieres no hablar, escribe tu respuesta y la llamada se cerrará sola para continuar por texto.');
            } catch (error) {
                console.error('Error al conectar la llamada:', error);
                agregarMensaje('system', 'No se pudo iniciar la llamada.');
                callButton.innerText = '📞';
                callButton.disabled = false;
            }
        });

        // Los subtítulos se re-dibujan completos en cada update porque el STT puede
        // corregir el texto de un turno mientras se afina, no solo añadir turnos nuevos.
        retellClient.on('update', (update) => {
            if (!Array.isArray(update.transcript)) return;
            turnosVoz = update.transcript
                .filter(t => t.content)
                .map(t => ({ role: t.role === 'agent' ? 'assistant' : 'user', content: t.content }));
            renderTodo();
        });

        retellClient.on('call_ended', () => {
            // La llamada terminó: lo que se veía como subtítulo pasa a ser parte
            // definitiva del hilo, para poder seguir la conversación por texto.
            hilo = [...hilo, ...turnosVoz];
            turnosVoz = [];
            enLlamada = false;
            callButton.innerText = '📞';
            callButton.classList.remove('en-llamada');
            statusDot.classList.remove('en-llamada');
            statusText.textContent = 'Habla o escribe, como prefieras';
            renderTodo();

            if (!conversacionCerrada) {
                agregarMensaje('system', 'Llamada finalizada. Puedes seguir escribiendo.');
                inputEl.focus();
            }

            if (resolverCierrePendiente) {
                resolverCierrePendiente();
                resolverCierrePendiente = null;
            }
        });

        // Mensaje inicial, igual al saludo que usa el agente de voz.
        agregarMensaje('assistant', 'Hola, soy Alex, tu asistente de inteligencia artificial para Intelindev. ¿En qué puedo ayudarte hoy?');
    </script>
</body>
</html>
