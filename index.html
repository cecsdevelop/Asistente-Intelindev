<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Asistente Web - Intelindev</title>
    <style>
        /* ESTILOS SOLO PARA VERCEL (Para centrar el botón en la pantalla de prueba) */
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; display: flex; justify-content: center; align-items: center; height: 100vh; background: #0f172a; margin: 0; }
        .widget-container { text-align: center; background: #1e293b; padding: 40px; border-radius: 20px; box-shadow: 0 10px 25px rgba(0,0,0,0.5); }
        h2 { color: #f8fafc; margin-bottom: 5px; }
        p { color: #94a3b8; margin-bottom: 30px; }
    </style>
</head>
<body>
    <div class="widget-container">
        <h2>Atención al Cliente</h2>
        <p>Prueba interna del asistente de voz de Intelindev.</p>

        <!-- ============================================================== -->
        <!-- ▼▼▼ ESTO ES LO QUE COPIARÁS A WORDPRESS EN EL FUTURO ▼▼▼ -->
        <!-- ============================================================== -->
        
        <!-- 1. EL BOTÓN -->
        <button id="callButton" style="padding: 15px 35px; font-size: 18px; font-weight: bold; color: white; background: #3b82f6; border: none; border-radius: 50px; cursor: pointer; transition: all 0.3s ease; box-shadow: 0 4px 15px rgba(59, 130, 246, 0.4);">
            📞 Iniciar Llamada
        </button>

        <!-- 2. EL SCRIPT DEL MOTOR DE VOZ -->
        <script type="module">
            import { RetellWebClient } from 'https://esm.sh/retell-client-js-sdk';

            const retellClient = new RetellWebClient();
            const button = document.getElementById('callButton');
            let isCalling = false;

            button.addEventListener('click', async () => {
                if (isCalling) {
                    retellClient.stopCall();
                    return; 
                }

                button.innerText = '⏳ Conectando...';
                button.style.background = '#eab308'; // Color amarillo al conectar

                try {
                    // Se conecta a tu servidor en Render
                    const response = await fetch('https://asistente-intelindev.onrender.com/create-web-call', { method: 'POST' });
                    const data = await response.json();

                    // Inicia la llamada
                    await retellClient.startCall({
                        accessToken: data.access_token,
                    });
                    
                    button.innerText = '🛑 Colgar Llamada';
                    button.style.background = '#ef4444'; // Color rojo al hablar
                    isCalling = true;

                } catch (error) {
                    console.error("Error al conectar:", error);
                    button.innerText = '❌ Error al conectar';
                    setTimeout(() => { 
                        button.innerText = '📞 Iniciar Llamada'; 
                        button.style.background = '#3b82f6';
                    }, 3000);
                }
            });

            // Resetea el botón al colgar
            retellClient.on('call_ended', () => {
                button.innerText = '📞 Iniciar Llamada';
                button.style.background = '#3b82f6';
                isCalling = false;
            });
        </script>
        
        <!-- ============================================================== -->
        <!-- ▲▲▲ FIN DE LA SECCIÓN PARA WORDPRESS ▲▲▲ -->
        <!-- ============================================================== -->

    </div>
</body>
</html>
